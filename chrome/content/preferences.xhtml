<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="todolist-preferences-pane" class="todolist-prefs-container"
      onload="window.TaskFlow_Preferences.init(window)">
  <link rel="localization" href="taskflow.ftl"/>
  <html:header class="todolist-pref-header">
    <html:div class="todolist-pref-title-row">
      <html:img class="todolist-pref-brand-icon" src="chrome://taskflow/content/icons/icon.svg" width="20" height="20" alt=""/>
      <html:h1 data-l10n-id="taskflow-pref-title">Zotero TaskFlow</html:h1>
      <html:span class="todolist-pref-version">v17.0.0</html:span>
    </html:div>
    <html:p id="todolist-pref-status" class="todolist-pref-status" role="status" aria-live="polite" data-l10n-id="taskflow-pref-status-loading"></html:p>
  </html:header>

  <!-- 1. Workspace & Primary Views -->
  <html:details id="todolist-group-view" class="todolist-pref-card" open="open">
    <html:summary class="todolist-card-header">
      <html:span class="todolist-card-title" data-l10n-id="taskflow-pref-card-view-title"></html:span>
      <html:span class="todolist-card-chevron" aria-hidden="true"></html:span>
    </html:summary>
    <html:div class="todolist-card-body">
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-card-view-desc"></html:p>

      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-window"></html:div>
      <html:div id="todolist-pref-window" class="todolist-pref-content" />

      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-view"></html:div>
      <html:div id="todolist-pref-view" class="todolist-pref-content" />
    </html:div>
  </html:details>

  <!-- 2. Academic Templates & Task Defaults -->
  <html:details id="todolist-group-academic" class="todolist-pref-card">
    <html:summary class="todolist-card-header">
      <html:span class="todolist-card-title" data-l10n-id="taskflow-pref-card-academic-title"></html:span>
      <html:span class="todolist-card-chevron" aria-hidden="true"></html:span>
    </html:summary>
    <html:div class="todolist-card-body">
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-card-academic-desc"></html:p>

      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-academic-defaults"></html:div>
      <html:div id="todolist-pref-academic" class="todolist-pref-content" />
    </html:div>
  </html:details>

  <!-- 3. Zotero Library & Reader Integration -->
  <html:details id="todolist-group-literature" class="todolist-pref-card">
    <html:summary class="todolist-card-header">
      <html:span class="todolist-card-title" data-l10n-id="taskflow-pref-card-literature-title"></html:span>
      <html:span class="todolist-card-chevron" aria-hidden="true"></html:span>
    </html:summary>
    <html:div class="todolist-card-body">
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-card-literature-desc"></html:p>

      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-itempane"></html:div>
      <html:div id="todolist-pref-literature" class="todolist-pref-content" />

      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-reader"></html:div>
      <html:div id="todolist-pref-reader" class="todolist-pref-content" />
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-reader-desc"></html:p>
    </html:div>
  </html:details>

  <!-- 4. Child Note Cloud Sync & Auto-Tagging -->
  <html:details id="todolist-group-sync-tags" class="todolist-pref-card">
    <html:summary class="todolist-card-header">
      <html:span class="todolist-card-title" data-l10n-id="taskflow-pref-card-sync-tags-title"></html:span>
      <html:span class="todolist-card-chevron" aria-hidden="true"></html:span>
    </html:summary>
    <html:div class="todolist-card-body">
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-card-sync-tags-desc"></html:p>

      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-sync"></html:div>
      <html:div id="todolist-pref-sync" class="todolist-pref-content" />

      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-tags"></html:div>
      <html:div id="todolist-pref-tags" class="todolist-pref-content" />
    </html:div>
  </html:details>

  <!-- 5. Task Reminders & Daily Briefing -->
  <html:details id="todolist-group-reminders" class="todolist-pref-card">
    <html:summary class="todolist-card-header">
      <html:span class="todolist-card-title" data-l10n-id="taskflow-pref-card-reminders-title"></html:span>
      <html:span class="todolist-card-chevron" aria-hidden="true"></html:span>
    </html:summary>
    <html:div class="todolist-card-body">
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-card-reminders-desc"></html:p>

      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-daily-summary"></html:div>
      <html:div id="todolist-pref-reminders" class="todolist-pref-content" />
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-daily-summary-desc"></html:p>
    </html:div>
  </html:details>

  <!-- 6. Tag Assets, Backup & Data Security -->
  <html:details id="todolist-group-maintenance" class="todolist-pref-card">
    <html:summary class="todolist-card-header">
      <html:span class="todolist-card-title" data-l10n-id="taskflow-pref-card-backup-title"></html:span>
      <html:span class="todolist-card-chevron" aria-hidden="true"></html:span>
    </html:summary>
    <html:div class="todolist-card-body">
      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-custom-tags"></html:div>
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-custom-tags-desc"></html:p>
      <html:div id="todolist-pref-tags-list" class="todolist-pref-tag-list" style="display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0;" />
      <html:div class="todolist-tag-creator-bar" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <html:input type="text" id="todolist-new-tag-name" class="todolist-control" style="max-width: 220px;" data-l10n-id="taskflow-pref-new-tag-name" />
        <html:div class="todolist-color-picker-row" style="display: inline-flex; gap: 4px; align-items: center;">
          <html:button type="button" class="todolist-pref-color-dot active" data-color="#ef4444" style="background:#ef4444;" data-l10n-id="taskflow-pref-color-red" aria-pressed="true"></html:button>
          <html:button type="button" class="todolist-pref-color-dot" data-color="#f97316" style="background:#f97316;" data-l10n-id="taskflow-pref-color-orange" aria-pressed="false"></html:button>
          <html:button type="button" class="todolist-pref-color-dot" data-color="#eab308" style="background:#eab308;" data-l10n-id="taskflow-pref-color-yellow" aria-pressed="false"></html:button>
          <html:button type="button" class="todolist-pref-color-dot" data-color="#22c55e" style="background:#22c55e;" data-l10n-id="taskflow-pref-color-green" aria-pressed="false"></html:button>
          <html:button type="button" class="todolist-pref-color-dot" data-color="#3b82f6" style="background:#3b82f6;" data-l10n-id="taskflow-pref-color-blue" aria-pressed="false"></html:button>
          <html:button type="button" class="todolist-pref-color-dot" data-color="#a855f7" style="background:#a855f7;" data-l10n-id="taskflow-pref-color-purple" aria-pressed="false"></html:button>
          <html:button type="button" class="todolist-pref-color-dot" data-color="#ec4899" style="background:#ec4899;" data-l10n-id="taskflow-pref-color-pink" aria-pressed="false"></html:button>
          <html:button type="button" class="todolist-pref-color-dot" data-color="#64748b" style="background:#64748b;" data-l10n-id="taskflow-pref-color-slate" aria-pressed="false"></html:button>
        </html:div>
        <html:button id="todolist-btn-add-tag" type="button" class="todolist-pref-btn todolist-pref-btn-primary" data-l10n-id="taskflow-pref-btn-add-tag"></html:button>
      </html:div>

      <html:div class="todolist-pref-subheading" style="margin-top: 18px;" data-l10n-id="taskflow-pref-subheading-export"></html:div>
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-export-desc"></html:p>
      <html:div class="todolist-export-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 8px;">
        <html:button id="todolist-btn-export-json" type="button" class="todolist-pref-btn" data-l10n-id="taskflow-pref-btn-export-json"></html:button>
        <html:button id="todolist-btn-export-csv" type="button" class="todolist-pref-btn" data-l10n-id="taskflow-pref-btn-export-csv"></html:button>
        <html:button id="todolist-btn-export-markdown" type="button" class="todolist-pref-btn" data-l10n-id="taskflow-pref-btn-export-markdown"></html:button>
        <html:button id="todolist-btn-export-txt" type="button" class="todolist-pref-btn" data-l10n-id="taskflow-pref-btn-export-txt"></html:button>
      </html:div>

      <html:div class="todolist-pref-subheading" style="margin-top: 18px;" data-l10n-id="taskflow-pref-subheading-import"></html:div>
      <html:div class="todolist-import-bar" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px;">
        <html:select id="todolist-import-mode" class="todolist-control" style="max-width: 220px;" data-l10n-id="taskflow-pref-import-mode-select">
          <html:option value="merge" data-l10n-id="taskflow-pref-import-mode-merge"></html:option>
          <html:option value="overwrite" data-l10n-id="taskflow-pref-import-mode-overwrite"></html:option>
        </html:select>
        <html:button id="todolist-btn-import-file" type="button" class="todolist-pref-btn todolist-pref-btn-primary" data-l10n-id="taskflow-pref-btn-import-file"></html:button>
      </html:div>
      <html:p id="todolist-import-status" class="todolist-pref-desc" style="margin-top: 6px; font-size: 13px; color: var(--flow-pref-muted); font-weight: 500;"></html:p>

      <html:div class="todolist-pref-subheading" style="margin-top: 18px;" data-l10n-id="taskflow-pref-subheading-shortcuts"></html:div>
      <html:div class="todolist-shortcut-help">
        <html:p class="todolist-pref-desc">
          <strong data-l10n-id="taskflow-pref-shortcuts-help-title"></strong><html:br/>
          <html:span data-l10n-id="taskflow-pref-shortcuts-help-board"></html:span><html:br/>
          <html:span data-l10n-id="taskflow-pref-shortcuts-help-reader"></html:span><html:br/>
        </html:p>
      </html:div>

      <html:div class="todolist-pref-subheading" data-l10n-id="taskflow-pref-subheading-output"></html:div>
      <html:div class="todolist-action-group todolist-pref-actions">
        <html:button id="todolist-btn-print" type="button" class="todolist-pref-btn" data-l10n-id="taskflow-pref-btn-print"></html:button>
        <html:button id="todolist-btn-copy-summary" type="button" class="todolist-pref-btn" data-l10n-id="taskflow-pref-btn-copy-summary"></html:button>
      </html:div>

      <html:div class="todolist-pref-subheading todolist-pref-danger-heading" style="margin-top: 18px;" data-l10n-id="taskflow-pref-subheading-danger"></html:div>
      <html:p class="todolist-pref-desc" data-l10n-id="taskflow-pref-danger-desc"></html:p>
      <html:div class="todolist-action-group todolist-pref-actions todolist-action-group-danger">
        <html:button id="todolist-btn-clear-all" type="button" class="todolist-pref-btn todolist-pref-btn-danger" data-l10n-id="taskflow-pref-btn-clear-all"></html:button>
        <html:button id="todolist-btn-reset-defaults" type="button" class="todolist-pref-btn todolist-pref-btn-warning" data-l10n-id="taskflow-pref-btn-reset-defaults"></html:button>
      </html:div>
    </html:div>
  </html:details>

  <!-- Release Information Footer -->
  <html:footer class="todolist-pref-release-info todolist-release-info" data-l10n-id="taskflow-pref-release-info-footer">
    <html:div class="todolist-pref-release-title todolist-release-title" data-l10n-id="taskflow-pref-release-title"></html:div>
    <html:dl>
      <html:div>
        <html:dt data-l10n-id="taskflow-pref-release-notes-label"></html:dt>
        <html:dd data-l10n-id="taskflow-pref-release-notes-content"></html:dd>
      </html:div>
      <html:div>
        <html:dt data-l10n-id="taskflow-pref-build-date-label"></html:dt>
        <html:dd data-l10n-id="taskflow-pref-build-date-value"></html:dd>
      </html:div>
      <html:div>
        <html:dt data-l10n-id="taskflow-pref-package-download-label"></html:dt>
        <html:dd><html:a href="https://github.com/groele/Zotero-TaskFlow/releases/download/v17.0.0/zotero-taskflow-17.0.0.xpi" data-l10n-id="taskflow-pref-package-download-link"></html:a></html:dd>
      </html:div>
      <html:div>
        <html:dt data-l10n-id="taskflow-pref-repository-label"></html:dt>
        <html:dd><html:a href="https://github.com/groele/Zotero-TaskFlow" data-l10n-id="taskflow-pref-repository-link"></html:a></html:dd>
      </html:div>
    </html:dl>
  </html:footer>
</vbox>
